<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Orbit Crash</title>
    <meta
      name="description"
      content="Real-time crash game built with React, PixiJS and TypeScript: an authoritative round state machine, a validated WebSocket protocol, and a 60fps WebGL scene."
    />

    <!--
      Link previews (LinkedIn, Slack, X, iMessage).

      The URLs are absolute on purpose: crawlers have no base to resolve a
      relative path against, so a relative og:image yields no preview at all.
      That means the domain is hardcoded here and in og:url — update BOTH if
      the deployment moves.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Orbit Crash — real-time crash game" />
    <meta
      property="og:description"
      content="React + PixiJS + TypeScript. Authoritative round state machine, validated WebSocket protocol, 60fps WebGL scene."
    />
    <meta property="og:image" content="https://crashorbitgame.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://crashorbitgame.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Dark theme: the app is dark at every size, so the browser chrome
         should not flash white around it on load. -->
    <meta name="theme-color" content="#05070f" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
